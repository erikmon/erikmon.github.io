<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erik Mon</title>
    <meta name="description" content="Sitio oficial de Erik Mon para verificación app-ads.txt.">
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, #1e3a8a 0, transparent 34rem),
          var(--bg);
        color: var(--text);
      }

      main {
        width: min(100%, 680px);
        padding: 40px;
        border: 1px solid rgb(148 163 184 / 20%);
        border-radius: 24px;
        background: rgb(17 24 39 / 82%);
        box-shadow: 0 24px 80px rgb(0 0 0 / 28%);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 6vw, 4rem);
        line-height: 1;
        letter-spacing: -0.06em;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
      }

      a {
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .badge {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgb(56 189 248 / 12%);
        color: var(--accent);
        font-size: 0.9rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">GitHub Pages</span>
      <h1>Erik Mon</h1>
      <p>Sitio oficial para verificación de anuncios autorizados en apps.</p>
      <a href="/app-ads.txt">Ver app-ads.txt</a>
    </main>
  </body>
</html>
